name: ${ROCKY_ASSISTANT_SLUG:-hermes-assistant}

services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ROCKY_ASSISTANT_SLUG:-hermes-assistant}:local
    container_name: ${ROCKY_ASSISTANT_SLUG:-hermes-assistant}
    restart: unless-stopped
    command: hermes-assistant-run
    environment:
      # Hard-pin runtime paths and Docker settings; setup values are mounted as files.
      HERMES_DASHBOARD: "1"
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      ASSISTANT_CONFIG_DIR: /run/hermes-assistant/config
      ASSISTANT_SECRETS_DIR: /run/hermes-assistant/secrets
    ports:
      # Bind to localhost only. Never 0.0.0.0 on a personal machine.
      - "127.0.0.1:${ROCKY_API_PORT:-8642}:8642" # OpenAI-compatible API
      - "127.0.0.1:${ROCKY_DASHBOARD_PORT:-9119}:9119" # Web dashboard
    volumes:
      # Setup profile: created by scripts/setup.sh and loaded through scripts/compose.sh.
      - ./.assistant/config:/run/hermes-assistant/config:ro
      - ./.assistant/secrets:/run/hermes-assistant/secrets:ro
      # Runtime state: named Docker volumes, not host bind mounts. Export these
      # volumes to migrate the assistant to another machine.
      - hermes_data:/opt/data
      # Workbench: persistent project checkouts, similar to ~/codes on a host.
      # The assistant reuses repos here across tasks, fetches before work, and
      # creates task branches in the existing checkout. The entrypoint chowns
      # this volume to the hermes runtime user before Hermes starts.
      - hermes_workbench:/workbench
      # Inner Docker daemon state. This intentionally persists child images,
      # containers, volumes, build cache, and Compose project state so coding
      # agents can use Docker like they would on a standalone Linux machine.
      - hermes_docker:/var/lib/docker
      # The coding-agent global AGENTS.md is seeded to data/coding-agents/AGENTS.md
      # on first boot. The init hook (scripts/hermes-entrypoint.sh) symlinks
      # it into the per-tool config dirs at startup, so codex and opencode each
      # see it as their own AGENTS.md. Cursor sees the same file as
      # /workbench/AGENTS.md when launched with /workbench as the workspace.
      # Single source of truth.
    # Intentional: this is a trusted, high-power development assistant, not a
    # locked-down production service. The privileged container runs its own
    # Docker daemon, which avoids host-socket path mismatches for /workbench.
    privileged: true
    shm_size: "2g" # for browsers, Playwright, and large test suites
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hermes_data:
    name: ${ROCKY_ASSISTANT_SLUG:-hermes-assistant}_data
  hermes_workbench:
    name: ${ROCKY_ASSISTANT_SLUG:-hermes-assistant}_workbench
  hermes_docker:
    name: ${ROCKY_ASSISTANT_SLUG:-hermes-assistant}_docker
